<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">

<title>Shadowtechno Live</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050008;
    font-family: Arial, sans-serif;
}

/* =========================
   FOND
========================= */

body {
    background:
        radial-gradient(
            circle at 50% 50%,
            #210033 0%,
            #09000f 45%,
            #020003 100%
        );
}

/* Halo central */

.glow {
    position: absolute;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #7900ff;

    filter: blur(250px);

    opacity: .12;

    animation: glow 8s ease-in-out infinite;
}

/* =========================
   PARTICULES
========================= */

.particles {
    position: absolute;
    inset: 0;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #c77dff;

    box-shadow:
        0 0 10px #9d00ff,
        0 0 20px #9d00ff;

    opacity: .5;

    animation: float 8s linear infinite;
}

.p1 { left: 10%; top: 20%; animation-delay: 0s; }
.p2 { left: 20%; top: 70%; animation-delay: 2s; }
.p3 { left: 35%; top: 30%; animation-delay: 4s; }
.p4 { left: 50%; top: 80%; animation-delay: 1s; }
.p5 { left: 65%; top: 20%; animation-delay: 3s; }
.p6 { left: 80%; top: 60%; animation-delay: 5s; }
.p7 { left: 90%; top: 25%; animation-delay: 1s; }

/* =========================
   ZONE JEU
========================= */

.game {

    position: absolute;

    left: 60px;
    top: 60px;

    width: 1360px;
    height: 820px;

    border: 2px solid rgba(157,0,255,.55);

    background: rgba(0,0,0,.15);

    box-shadow:
        0 0 30px rgba(157,0,255,.12),
        inset 0 0 30px rgba(157,0,255,.04);

}

/* coins */

.game::before,
.game::after {

    content: "";

    position: absolute;

    width: 80px;
    height: 80px;

    border-color: #a000ff;
    border-style: solid;
}

.game::before {

    left: -2px;
    top: -2px;

    border-width: 3px 0 0 3px;
}

.game::after {

    right: -2px;
    bottom: -2px;

    border-width: 0 3px 3px 0;
}

/* =========================
   WEBCAM
========================= */

.webcam {

    position: absolute;

    right: 50px;
    top: 60px;

    width: 400px;
    height: 260px;

    border: 2px solid #9b00ff;

    background: rgba(10,0,20,.75);

    box-shadow:
        0 0 25px rgba(155,0,255,.3);

}

/* titre webcam */

.webcamTitle {

    position: absolute;

    bottom: -36px;
    left: 0;

    color: white;

    font-size: 18px;

    letter-spacing: 4px;

    text-transform: uppercase;
}

/* =========================
   CHAT
========================= */

.chat {

    position: absolute;

    right: 50px;
    bottom: 90px;

    width: 400px;
    height: 500px;

    border: 2px solid rgba(155,0,255,.55);

    background:
        linear-gradient(
            180deg,
            rgba(20,0,35,.8),
            rgba(5,0,10,.85)
        );

    box-shadow:
        0 0 25px rgba(155,0,255,.15);
}

.chatTitle {

    height: 55px;

    display: flex;

    align-items: center;

    padding-left: 25px;

    color: white;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: 4px;

    border-bottom: 1px solid rgba(155,0,255,.5);
}

/* =========================
   NOM
========================= */

.brand {

    position: absolute;

    left: 60px;
    bottom: 30px;

    color: white;

    font-size: 25px;

    font-weight: 900;

    letter-spacing: 8px;

    text-shadow:
        0 0 10px #9b00ff,
        0 0 25px #9b00ff;
}

/* ligne */

.brand::after {

    content: "";

    position: absolute;

    left: 0;
    bottom: -10px;

    width: 100%;
    height: 2px;

    background: #9b00ff;

    box-shadow:
        0 0 10px #9b00ff;
}

/* =========================
   LIVE
========================= */

.live {

    position: absolute;

    top: 25px;
    right: 30px;

    padding: 10px 22px;

    border: 1px solid #9b00ff;

    color: white;

    font-size: 14px;

    letter-spacing: 4px;

    background: rgba(155,0,255,.1);

    box-shadow:
        0 0 15px rgba(155,0,255,.3);

}

/* point */

.live::before {

    content: "";

    display: inline-block;

    width: 8px;
    height: 8px;

    margin-right: 10px;

    border-radius: 50%;

    background: #b000ff;

    box-shadow:
        0 0 10px #b000ff;

    animation: blink 1.5s infinite;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes glow {

    0%,100% {
        transform: translate(-50%,-50%) scale(.8);
        opacity: .08;
    }

    50% {
        transform: translate(-50%,-50%) scale(1.2);
        opacity: .16;
    }
}

@keyframes float {

    0% {
        transform: translateY(0);
        opacity: .2;
    }

    50% {
        opacity: .7;
    }

    100% {
        transform: translateY(-120px);
        opacity: 0;
    }
}

@keyframes blink {

    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .25;
    }
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="particles">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
</div>

<div class="game"></div>

<div class="webcam">
    <div class="webcamTitle">CAMERA</div>
</div>

<div class="chat">
    <div class="chatTitle">CHAT</div>
</div>

<div class="live">
    LIVE
</div>

<div class="brand">
    SHADOWTECHNO
</div>

</body>
</html>
